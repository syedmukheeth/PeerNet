<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="PeerNet. Share moments, connect with the world." />

  <!-- Paints the browser chrome to match the app ground rather than leaving it
       white above a dark page. Two entries, because the theme follows the OS. -->
  <meta name="theme-color" content="#f9f8fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0a0f" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PeerNet" />
  <meta property="og:title" content="PeerNet" />
  <meta property="og:description" content="PeerNet. Share moments, connect with the world." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="PeerNet" />
  <meta name="twitter:description" content="PeerNet. Share moments, connect with the world." />

  <title>PeerNet</title>
  <!-- Theme flash guard: runs synchronously before first paint -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pn-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
