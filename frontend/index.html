<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PeerNet — Share moments, connect with the world" />
  <title>PeerNet</title>
  <!-- Theme flash guard: runs synchronously before first paint -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pn-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="desktop-only-blocker">
    <div class="blocker-content">
      <img src="/assets/desktop-only.png" alt="Desktop Only" class="blocker-img" />
      <h1 class="blocker-title">Desktop Experience Only</h1>
      <p class="blocker-text">PeerNet is optimized for high-performance desktop workflows. Please switch to a desktop device or enable desktop mode to continue.</p>
      <div class="blocker-action">
        <span class="blocker-badge">Optimized for Desktop</span>
      </div>
      <button 
        onclick="document.getElementById('desktop-only-blocker').style.display='none'; document.getElementById('root').style.display='block'; document.body.style.overflow='auto';"
        style="margin-top: 1.5rem; padding: 0.8rem 1.5rem; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 149, 246, 0.2);"
      >
        Continue to Site
      </button>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
