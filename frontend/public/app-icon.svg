<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <title>PeerNet</title>
  <!-- Installed-app icon. Padded to survive a maskable crop (the mark sits
       inside the safe circle, 40% of the shortest side from centre) and on a
       fixed dark ground, since a home screen has no theme to follow. -->
  <rect width="512" height="512" fill="#0b0a0f"/>
  <g transform="translate(96 96) scale(10)">
    <line x1="13.4" y1="18.6" x2="18.6" y2="13.4" stroke="#eceaf2" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="9.5" cy="22.5" r="5.4" fill="#8b7bff"/>
    <circle cx="22.5" cy="9.5" r="5.4" stroke="#eceaf2" stroke-width="2.6"/>
  </g>
</svg>
