<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PeerNet">
  <title>PeerNet</title>
  <!--
    The mark this replaces was a 1024px tile with a #6B4FFF to #00D4FF gradient
    and was referenced nowhere: every consumer imported logo.png instead.

    Drawn on the same 8pt grid as the interface. The gradient runs between the
    two ends of the Iris ramp, --accent (#8B7BFF) to --accent-2 (#4C3BA8), which
    is the only gradient in the product; every other surface is flat. The
    counter is cut with fill-rule evenodd rather than being painted over in the
    background colour, so the mark stays correct on any ground.
  -->
  <defs>
    <linearGradient id="pn-iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#4C3BA8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#pn-iris)"/>
  <path
    d="M22 14H37a11 11 0 0 1 0 22H29v14h-7Z M29 21H37a4 4 0 0 1 0 8h-8Z"
    fill="#0B0A0F"
    fill-rule="evenodd"/>
</svg>
